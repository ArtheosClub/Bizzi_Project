name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'ArtheosClub/Bizzi_Project' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/wp15-bounded-task-service'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: bizzi
          POSTGRES_PASSWORD: bizzi
          POSTGRES_DB: bizzi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizzi -d bizzi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SYNTHETIC_EXECUTION_PROFILE: ci_test
      BIZZI_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      BIZZI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DATABASE_URL: postgresql+psycopg://bizzi:bizzi@localhost:5432/bizzi_test

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record exact event-head checkout
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$BIZZI_PR_HEAD_SHA"
          echo "BIZZI_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"

      # Verified current (git ls-remote --tags, 2026-07-17):
      # actions/checkout v7.0.0, astral-sh/setup-uv v8.3.2. uv/Python
      # versions below match docs/planning/TECH_STACK.md exactly.
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.13.14"

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app tests/ci_verification.py

      - name: Run migrations against a clean database
        run: uv run alembic upgrade head

      - name: Prepare option L evidence and scratch
        run: |
          python - <<'PY_L_PATHS'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          evidence = root / "option-l-evidence"
          scratch = root / "option-l-scratch"
          if evidence.exists() or scratch.exists():
              raise SystemExit("Fresh option L paths required")
          evidence.mkdir()
          scratch.mkdir()
          (evidence / "rollback").mkdir()
          values = {
              "BIZZI_L_EVIDENCE": str(evidence),
              "BIZZI_REPORT_PATH": str(evidence / "ci35.summary.json"),
              "BIZZI_JUNIT_PATH": str(evidence / "ci35.junit.xml"),
              "BIZZI_EVIDENCE_DIR": str(scratch),
              "BIZZI_B4_EVIDENCE_DIR": str(evidence / "rollback"),
          }
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY_L_PATHS

      - name: Test (pytest)
        run: |
          files=$(uv run python -m tests.ci_verification --list-files tests/ci_test_inventory.json) || exit 1
          test -n "$files" || exit 1
          uv run python -m pytest -p tests.ci_verification -p no:cacheprovider \
            --junitxml="$BIZZI_JUNIT_PATH" \
            $files

      - name: Require partition guard node
        run: |
          python - <<'PY_L_GUARD'
          import os
          import xml.etree.ElementTree as ET
          tree = ET.parse(os.environ["BIZZI_JUNIT_PATH"])
          matches = [node for node in tree.findall(".//testcase")
                     if node.get("classname") == "tests.test_ci_verification"
                     and node.get("name") == "test_repository_partition_matches_declared_venues"]
          if len(matches) != 1 or any(
              matches[0].find(tag) is not None for tag in ("failure", "error", "skipped")
          ):
              raise SystemExit("Required partition guard missing or not successful")
          print("Partition guard passed; one local-only file governed by Owner record L")
          PY_L_GUARD

      - name: Validate full zero-skip result
        run: |
          uv run python -m tests.ci_verification \
            --summary "$BIZZI_REPORT_PATH" \
            --junit "$BIZZI_JUNIT_PATH" \
            --inventory tests/ci_test_inventory.json \
            --head "$BIZZI_PR_HEAD_SHA"


  compose-e2e:
    name: docker compose up (Gate B step 7 end-to-end)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Prepare .env (mirrors the documented fresh-clone flow)
        run: cp .env.example .env

      # --wait blocks until every service's healthcheck passes (postgres,
      # postgres-test, api) and fails the step non-zero if any service
      # becomes unhealthy or exits within --wait-timeout. This is the real
      # proof for Gate B step 7: image build, container startup, Postgres
      # connectivity, and the entrypoint's `alembic upgrade head` all have
      # to succeed for api's own healthcheck to ever go green.
      # Flags verified against this repo's own `docker compose up --help`
      # before use (v5.1.1 locally) rather than assumed from memory.
      - name: docker compose up --build (fails loudly on build or health failure)
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Assert /health responds 200 from outside the container
        run: |
          curl -fsS http://localhost:8000/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Dump container logs (always, for debuggability)
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    if: >-
      github.repository == 'ArtheosClub/Bizzi_Project' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'feat/wp15-bounded-task-service') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: bizzi
          POSTGRES_PASSWORD: bizzi
          POSTGRES_DB: bizzi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizzi -d bizzi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SYNTHETIC_EXECUTION_PROFILE: ci_test
      BIZZI_EVENT_HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || '' }}
      BIZZI_EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BIZZI_PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
      BIZZI_PUSH_AFTER: ${{ github.event_name == 'push' && github.event.after || '' }}
      BIZZI_PUSH_FORCED: ${{ github.event_name == 'push' && toJSON(github.event.forced) || '' }}
      BIZZI_PUSH_DELETED: ${{ github.event_name == 'push' && toJSON(github.event.deleted) || '' }}
      DATABASE_URL: postgresql+psycopg://bizzi:bizzi@localhost:5432/bizzi_test

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact event-head checkout
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$BIZZI_EVENT_HEAD_SHA"
          echo "BIZZI_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"

      # Verified current (git ls-remote --tags, 2026-07-17):
      # actions/checkout v7.0.0, astral-sh/setup-uv v8.3.2. uv/Python
      # versions below match docs/planning/TECH_STACK.md exactly.
      - name: Install uv + Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.13.14"

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy app tests/ci_verification.py tests/ci_compose_verification.py

      - name: Run migrations against a clean database
        run: uv run alembic upgrade head

      - name: Prepare option L evidence and scratch
        run: |
          python - <<'PY_L_PATHS'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          evidence = root / "option-l-evidence"
          scratch = root / "option-l-scratch"
          if evidence.exists() or scratch.exists():
              raise SystemExit("Fresh option L paths required")
          evidence.mkdir()
          scratch.mkdir()
          (evidence / "rollback").mkdir()
          values = {
              "BIZZI_L_EVIDENCE": str(evidence),
              "BIZZI_REPORT_PATH": str(evidence / "ci35.summary.json"),
              "BIZZI_JUNIT_PATH": str(evidence / "ci35.junit.xml"),
              "BIZZI_EVIDENCE_DIR": str(scratch),
              "BIZZI_B4_EVIDENCE_DIR": str(evidence / "rollback"),
          }
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY_L_PATHS

      - name: Test (pytest)
        run: |
          files=$(uv run python -m tests.ci_verification --list-files tests/ci_test_inventory.json) || exit 1
          test -n "$files" || exit 1
          uv run python -m pytest -p tests.ci_verification -p no:cacheprovider \
            --junitxml="$BIZZI_JUNIT_PATH" \
            $files

      - name: Require partition guard node
        run: |
          python - <<'PY_L_GUARD'
          import os
          import xml.etree.ElementTree as ET
          tree = ET.parse(os.environ["BIZZI_JUNIT_PATH"])
          matches = [node for node in tree.findall(".//testcase")
                     if node.get("classname") == "tests.test_ci_verification"
                     and node.get("name") == "test_repository_partition_matches_declared_venues"]
          if len(matches) != 1 or any(
              matches[0].find(tag) is not None for tag in ("failure", "error", "skipped")
          ):
              raise SystemExit("Required partition guard missing or not successful")
          print("Partition guard passed; one local-only file governed by Owner record L")
          PY_L_GUARD

      - name: Validate full zero-skip result
        run: |
          uv run python -m tests.ci_verification \
            --summary "$BIZZI_REPORT_PATH" \
            --junit "$BIZZI_JUNIT_PATH" \
            --inventory tests/ci_test_inventory.json \
            --head "$BIZZI_EVENT_HEAD_SHA"


  compose-e2e:
    name: docker compose up (Gate B step 7 end-to-end)
    if: >-
      github.repository == 'ArtheosClub/Bizzi_Project' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'feat/wp15-bounded-task-service') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted))
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    env:
      BIZZI_EVENT_HEAD_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || '' }}
      BIZZI_EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BIZZI_PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
      BIZZI_PUSH_AFTER: ${{ github.event_name == 'push' && github.event.after || '' }}
      BIZZI_PUSH_FORCED: ${{ github.event_name == 'push' && toJSON(github.event.forced) || '' }}
      BIZZI_PUSH_DELETED: ${{ github.event_name == 'push' && toJSON(github.event.deleted) || '' }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact event-head checkout
        run: |
          actual=$(git rev-parse HEAD)
          test "$actual" = "$BIZZI_EVENT_HEAD_SHA"
          echo "BIZZI_CHECKOUT_SHA=$actual" >> "$GITHUB_ENV"
      - name: Collect bounded migration and health evidence
        # No raw build/up/psql/service logs printed; no uploader or explicit down -v.
        # Hosted execution still requires its own Owner runtime/publication grant.
        run: |
          python -m tests.ci_compose_verification \
            --evidence "$RUNNER_TEMP/compose-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
